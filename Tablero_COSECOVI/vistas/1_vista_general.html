<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista general · Tablero COSECOVI</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .mapa-c { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; padding: 0 18px 18px; align-items: start; }
  .lado { display: grid; gap: 14px; }
  .info { display: grid; gap: 10px; font-size: 12.5px; background: #fbf8f9; border-radius: 10px; padding: 14px; }
  .info small { display: block; color: var(--texto-2); font-weight: 700; font-size: 11px; }
  .info b { display: block; margin-top: 2px; }
  .info .atajos-ir { flex-direction: column; align-items: flex-start; }
  .leyenda-mapa { display: grid; gap: 8px; font-size: 12px; }
  .leyenda-mapa div { display: flex; gap: 8px; align-items: center; }
  .leyenda-mapa small { display: block; color: var(--texto-2); }
  @media (max-width: 900px) { .mapa-c { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="pagina"></div>
<script src="../datos.js"></script><script src="../modelo.js"></script><script src="../cabecera.js"></script><script src="../graficas.js"></script><script src="../mapa.js"></script>
<script>
(function () {
  if (!UI.cabecera('general')) return;
  const I = UI.ICON;
  let modo = 'calor', sel = null;

  UI.filtros(
    UI.fSelect('f-grupo', 'Delito', Object.keys(M.GRUPOS), '', 'Todos los delitos', '') +
    UI.fSelect('f-sem', 'Semáforo', ['Rojo', 'Amarillo'], '', 'Todos') +
    UI.fSelect('f-amb', 'Ámbito', ['Interno', 'Externo'], '', 'Interno y externo'),
    UI.fSelect('f-modo', 'Modalidad (cómo)', M.MODOS, '', 'Todas') +
    UI.fSelect('f-afe', 'Tipo de afectado', M.AFECTADOS, '', 'Todos') +
    UI.fSelect('f-fase', 'Fase', M.FASES, '', 'Todas') +
    '<div class="campo hora"><label for="f-hd">Hora desde</label><input type="time" id="f-hd"></div><div class="campo hora"><label for="f-hh">Hora hasta</label><input type="time" id="f-hh"></div>');

  document.querySelector('.pagina').innerHTML =
    UI.encabezado('escudo', 'MONITOREO PREVENTIVO', 'Vista general por zona', 'Prioridades de atención dentro del plantel y en su entorno inmediato.') +
    '<div class="kpis" id="kpis"></div>' +
    '<section class="tarjeta"><div class="tit"><div><small>PLANTEL Y RADIO DE CONSIDERACIÓN</small><h2>Mapa de riesgo ESCOM</h2><p id="ayudaMapa">Selecciona un punto para consultar el incidente predominante.</p></div>' +
      '<div class="seg" id="modo"><button data-m="calor" class="on">Mapa de calor</button><button data-m="puntos">Puntos de incidentes</button></div></div>' +
      '<div class="mapa-c"><div id="mapa"></div><div class="lado"><div class="info" id="info"></div>' +
        '<div class="leyenda-mapa"><div>' + UI.icSem('Rojo') + '<span><b>Alto</b><small>Atención inmediata</small></span></div><div>' + UI.icSem('Amarillo') + '<span><b>Medio</b><small>Atención preventiva</small></span></div>' +
        '<div><span style="width:22px;height:14px;border:2px dashed var(--guinda);border-radius:50%;flex:none"></span><span><b>Radio</b><small>Área considerada</small></span></div></div>' +
        '<details class="clave-d"><summary>Semáforo de delitos</summary>' +
          '<div class="niv" style="color:var(--rojo)">' + UI.icSem('Rojo') + 'Atención mayor</div><ul><li>Robos con o sin violencia</li><li>Denuncias por extorsión</li><li>Denuncias por acoso</li><li>Denuncias por ciberacoso</li></ul>' +
          '<div class="niv" style="color:var(--amarillo)">' + UI.icSem('Amarillo') + 'Atención amarilla</div><ul><li>Delitos contra la salud: drogas, alcohol u otros</li><li>Violencia</li></ul></details>' +
      '</div></div>' +
    '</section>' +
    '<div id="estad"></div>';

  const $ = id => document.getElementById(id);
  const filtro = () => Object.assign(UI.filtroGlobal(), { ambito: $('f-amb').value, afectado: $('f-afe').value, fase: $('f-fase').value, modo: $('f-modo').value, horaDesde: $('f-hd').value, horaHasta: $('f-hh').value, grupo: $('f-grupo').value, semaforo: $('f-sem').value });

  /* Clic en un punto del mapa:
     - Puntos de incidentes: abre Inspección de casos particulares con los casos de ese lugar y la ficha del más reciente (con su expediente).
     - Mapa de calor: selecciona el lugar y actualiza el resumen de abajo. */
  function clicPunto(id) {
    if (modo === 'puntos') {
      const rs = M.filtrar(filtro()).filter(r => r.lug === id), ult = rs[rs.length - 1];
      const h = UI.enlace('inspeccion', { lugar: id, caso: ult ? ult.cos : '' });
      if (h) { location.href = h; return; }
    }
    sel = id; pintar();
  }
  function pintar() {
    /* La modalidad depende del delito elegido (taxonomía) */
    const gSel = $('f-grupo').value, modos = gSel ? [...new Set(M.GRUPOS[gSel].flatMap(t => M.MODOS_TIPO[t]))] : M.MODOS, mAct = $('f-modo').value;
    $('f-modo').innerHTML = UI.opts(modos, modos.includes(mAct) ? mAct : '', 'Todas');
    const f = filtro(), L = M.filtrar(f), K = M.metricas(L);
    const ind = K.indice, niv = M.nivelIndice(ind);
    $('kpis').innerHTML =
      UI.kpi('escudo', '', 'Incidentes totales', K.total, 'En el periodo seleccionado', 'b-guinda') +
      UI.kpi('alerta', 'rojo', 'Incidentes rojos', K.rojos, M.u.pct(K.rojos, K.total) + ' % del total', 'b-rojo') +
      UI.kpi('alerta', 'amar', 'Incidentes amarillos', K.amarillos, M.u.pct(K.amarillos, K.total) + ' % del total', 'b-amar') +
      UI.kpi('mapa', '', 'Zonas de mayor riesgo', K.zonasTop.length, K.zonasTop.map(z => z.replace(' del plantel', '')).join(', ') || '—', 'b-guinda') +
      UI.kpi('tendencia', '', 'Índice de riesgo general', ind + '/100', UI.chipNivel(niv), 'b-guinda') +
      UI.kpi('reloj', '', 'Horario crítico', K.franjaCritica, K.franjaCriticaN + ' incidentes registrados', 'b-guinda');

    $('ayudaMapa').textContent = modo === 'puntos' ? 'Da clic en un punto para abrir sus casos y su expediente en Inspección de casos particulares.' : 'Selecciona un punto para consultar el incidente predominante; a la derecha tienes los atajos.';
    const res = MAPA.plano($('mapa'), L, { modo, sel, etiquetas: modo === 'puntos', alSeleccionar: clicPunto });
    if (!sel || !res.grupos[sel]) sel = Object.keys(res.grupos).filter(k => M.DATOS.lugares[k].x !== null).sort((a, b) => res.grupos[b].length - res.grupos[a].length)[0] || null;
    if (sel) {
      const rs = res.grupos[sel], tipo = M.mayor(M.contar(rs, r => r.tipo)), hora = M.mayor(M.contar(rs, r => r.hora.slice(0, 2) + ':00'));
      const mes = M.mayor(M.contar(rs, r => r.fecha.slice(0, 7))), fase = M.mayor(M.contar(rs, r => r.fase)), semR = rs.filter(r => r.semaforo === 'Rojo').length >= rs.length / 2;
      $('info').innerHTML = '<div><small>Lugar · ' + rs.length + ' reportes</small><b>' + M.DATOS.lugares[sel].nombre + '</b></div><div><small>Tipo predominante</small><b>' + M.corto(tipo) + '</b></div>' +
        '<div><small>Hora frecuente</small><b>' + hora + '</b></div><div><small>Gravedad</small><b>' + UI.sem(semR ? 'Rojo' : 'Amarillo', semR ? 'Atención mayor' : 'Atención amarilla') + '</b></div>' +
        '<div><small>Fase predominante · Mes</small><b>' + fase + ' · ' + M.u.mesCorto(mes) + '</b></div>' +
        '<div class="atajos-ir">' + UI.ir('delito', { delito: M.grupoDe(tipo) }, 'Analizar ' + M.grupoDe(tipo).toLowerCase()) + UI.ir('inspeccion', { lugar: sel }, 'Ver los ' + rs.length + ' casos de este lugar') + UI.ir('recomendaciones', { grupo: M.grupoDe(tipo) }, 'Ver recomendaciones') + '</div>';
      MAPA.plano($('mapa'), L, { modo, sel, etiquetas: modo === 'puntos', alSeleccionar: clicPunto });
    } else $('info').innerHTML = '<div><small>Sin incidentes ubicables con estos filtros</small></div>';

    const porTipo = M.TIPOS.map(t => ({ et: M.corto(t), v: L.filter(r => r.tipo === t).length, color: ['Consumo de alcohol o drogas', 'Violencia (riña o agresión)'].includes(t) ? G.COL.amar : G.COL.rojo }));
    const serie = M.serieMensual(L, f.desde, f.hasta);
    $('estad').innerHTML = UI.seccion('Estadísticas', 'Distribución de los incidentes del periodo con los filtros aplicados.', [
      UI.tarjetaG('DISTRIBUCIÓN', 'Incidentes por categoría', '<div id="bar-tipos">' + G.barras(porTipo, null, 120) + '</div><p class="nota" style="margin:4px 0 0">Selecciona una categoría para analizarla.</p>' +
        '<div class="leyenda" style="margin-top:8px"><span><i style="background:' + G.COL.rojo + '"></i>Atención mayor</span><span><i style="background:' + G.COL.amar + '"></i>Atención amarilla</span></div>', '<b style="font-size:20px;color:var(--guinda)">' + K.total + '</b>'),
      UI.tarjetaG('POR HORA DEL DÍA', 'Horario crítico', G.columnas(M.FRANJAS.map(fr => ({ et: fr.slice(0, 2), v: K.franjas[fr] }))) +
        '<div class="destacado">' + I.reloj + 'Franja con mayor incidencia: ' + K.franjaCritica + ' · ' + K.franjaCriticaN + ' incidentes</div>', '<span class="chip np n-alto">' + K.franjaCritica + '</span>'),
      UI.tarjetaG('TENDENCIA', 'Incidentes por mes', G.linea(serie, { W: 360, H: 170 })),
      UI.tarjetaG('ÁMBITO', 'Interno y externo', G.dona([{ et: 'Interno', v: K.interno, color: G.COL.guinda }, { et: 'Externo', v: K.externo, color: G.COL.guinda2 }])),
      UI.tarjetaG('A QUIÉN', 'Por tipo de afectado', G.barras(M.AFECTADOS.map(a => ({ et: a, v: L.filter(r => r.afectado === a).length })), G.COL.guinda, 80) + '<p class="nota" style="margin-top:8px">' + I.candado + 'Solo cifras agregadas, sin datos personales.</p>')
    ]);
    $('bar-tipos').querySelectorAll('.barra').forEach((b, i) => { const h = UI.enlace('delito', { delito: M.grupoDe(M.TIPOS[i]) }); if (h) { b.style.cursor = 'pointer'; b.onclick = () => location.href = h; } });
  }

  $('modo').querySelectorAll('button').forEach(b => b.onclick = () => { modo = b.dataset.m; $('modo').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); pintar(); });
  ['f-hd', 'f-hh', 'f-grupo', 'f-modo', 'f-sem', 'f-amb', 'f-afe', 'f-fase'].forEach(id => $(id).onchange = () => { sel = null; pintar(); });
  $('limpiar').onclick = () => { ['f-hd', 'f-hh', 'f-grupo', 'f-modo', 'f-sem', 'f-amb', 'f-afe', 'f-fase'].forEach(id => $(id).value = ''); sel = null; pintar(); };
  UI.alCambiarPeriodo(() => { sel = null; pintar(); });
  pintar();
})();
</script>
</body>
</html>
