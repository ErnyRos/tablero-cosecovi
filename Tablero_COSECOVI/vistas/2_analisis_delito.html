<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis por delito · Tablero COSECOVI</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .cab-delito { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-left: 4px solid var(--rojo-solido); }
  .cab-delito.amar { border-left-color: var(--amarillo-solido); }
  .cab-delito .ico { width: 44px; height: 44px; border-radius: 10px; background: var(--guinda-claro); color: var(--guinda); display: grid; place-items: center; flex: none; }
  .cab-delito h2 { margin: 6px 0 2px; font-size: 20px; }
  .cab-delito p { margin: 0; font-size: 12.5px; color: var(--texto-2); }
  .tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .mapa-c { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; padding: 0 18px 18px; align-items: start; }
  .ctx { background: #fbf8f9; border-radius: 10px; padding: 12px 14px; }
  .ctx .factor:first-of-type { border-top: none; }
  @media (max-width: 900px) { .mapa-c { grid-template-columns: 1fr; } }
  .factor { display: flex; gap: 8px; padding: 9px 0; border-top: 1px solid var(--borde); font-size: 12px; }
  .factor svg { width: 15px; height: 15px; color: var(--guinda); flex: none; margin-top: 1px; }
  .factor b { display: block; font-size: 12.5px; }
  .factor span { color: var(--texto-2); }
  .cambio { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 6px; background: var(--rojo-bg); color: var(--rojo); white-space: nowrap; }
  .cambio.baja { background: var(--verde-bg); color: var(--verde); }
</style>
</head>
<body>
<div class="pagina"></div>
<script src="../datos.js"></script><script src="../modelo.js"></script><script src="../cabecera.js"></script><script src="../graficas.js"></script><script src="../mapa.js"></script>
<script>
(function () {
  if (!UI.cabecera('delito')) return;
  const I = UI.ICON, GR = Object.keys(M.GRUPOS);
  let patron = 'dia';
  const inicial = new URLSearchParams(location.search).get('delito');

  UI.filtros(
    UI.fSelect('f-grupo', 'Delito', GR, GR.includes(inicial) ? inicial : GR[0]).replace('class="campo"', 'class="campo ancho"') +
    UI.fCampo('f-modo', 'Modalidad (cómo)', '<select id="f-modo"></select>') +
    UI.fSelect('f-amb', 'Ámbito', ['Interno', 'Externo'], '', 'Interno y externo'),
    UI.fSelect('f-afe', 'Tipo de afectado', M.AFECTADOS, '', 'Todos') +
    UI.fSelect('f-fase', 'Fase', M.FASES, '', 'Todas') +
    '<div class="campo hora"><label for="f-hd">Hora desde</label><input type="time" id="f-hd"></div><div class="campo hora"><label for="f-hh">Hora hasta</label><input type="time" id="f-hh"></div>');

  document.querySelector('.pagina').innerHTML =
    UI.encabezado('escudo', 'CONSULTA ESPECIALIZADA', 'Análisis por delito', 'Comportamiento, ubicación y registros del delito seleccionado.') +
    '<section class="tarjeta cab-delito" id="cabd"></section>' +
    '<div class="kpis" id="kpis"></div>' +
    '<section class="tarjeta"><div class="tit"><div><small>UBICACIÓN DE REPORTES</small><h2>Incidentes de este delito</h2><p>Se muestran únicamente los puntos asociados a la selección. Da clic en un punto para abrir sus casos y su expediente.</p></div><span class="chip np n-alto" id="npuntos"></span></div>' +
      '<div class="mapa-c"><div id="mapa"></div><div class="ctx" id="contexto"></div></div></section>' +
    '<section class="tarjeta"><div class="tit"><div><small>DETALLE DEL PERIODO</small><h2>Incidentes registrados por lugar</h2><p>Registros ficticios consolidados para fines de visualización.</p></div></div>' +
      '<div class="t-env"><table class="t"><thead><tr><th>Lugar / Ubicación</th><th>Fecha(s)</th><th>Hora(s)</th><th class="num">Número de veces</th><th>Gravedad</th><th>Fase</th><th>Acuerdo COSECOVI · acciones tomadas</th><th></th></tr></thead><tbody id="detalle"></tbody></table></div></section>' +
    '<div id="estad"></div>';

  const $ = id => document.getElementById(id);
  function pintar() {
    const g = $('f-grupo').value, base = UI.filtroGlobal();
    const extra = { ambito: $('f-amb').value, afectado: $('f-afe').value, fase: $('f-fase').value, horaDesde: $('f-hd').value, horaHasta: $('f-hh').value };
    /* La modalidad depende del delito elegido (taxonomía) */
    const modosG = [...new Set(M.GRUPOS[g].flatMap(t => M.MODOS_TIPO[t]))], mSel = modosG.includes($('f-modo').value) ? $('f-modo').value : '';
    $('f-modo').innerHTML = UI.opts(modosG, mSel, 'Todas');
    const todos = M.filtrar(Object.assign({}, base, extra)), L = todos.filter(r => M.GRUPOS[g].includes(r.tipo) && (!mSel || r.modo === mSel)), K = M.metricas(L);
    const rojo = L.length ? L[0].semaforo === 'Rojo' : !['Delitos contra la salud', 'Violencia'].includes(g);
    const ind = M.indiceGrupo(g, todos);
    const lugares = M.contar(L, r => M.DATOS.lugares[r.lug].nombre.split(',')[0].split(' · ')[0]);
    const topL = Object.keys(lugares).sort((a, b) => lugares[b] - lugares[a]);

    $('cabd').className = 'tarjeta cab-delito' + (rojo ? '' : ' amar');
    $('cabd').innerHTML = '<div class="ico">' + I.escudoOk + '</div><div><span class="tag" style="color:' + (rojo ? 'var(--rojo)' : 'var(--amarillo)') + '">' + UI.icSem(rojo ? 'Rojo' : 'Amarillo') + (rojo ? 'Atención mayor (Rojo)' : 'Atención amarilla') + '</span>' +
      '<h2>' + g + '</h2><p>' + M.DESC_GRUPO[g] + '</p></div><div class="atajos-ir" style="margin-left:auto;flex-direction:column;align-items:flex-end">' + UI.ir('recomendaciones', { grupo: g }, 'Ver recomendaciones') + UI.ir('inspeccion', { grupo: g }, 'Ver casos en Inspección') + UI.ir('reportes', { tipo: M.GRUPOS[g].length === 1 ? M.GRUPOS[g][0] : '' }, 'Ver en el reporte mensual') + '</div>';
    $('kpis').innerHTML =
      UI.kpi('escudo', '', 'Total de incidentes', K.total, M.u.pct(K.total, todos.length) + ' % del total', 'b-guinda') +
      UI.kpi('tendencia', '', 'Índice de riesgo', ind + ' / 100', 'Nivel ' + M.nivelIndice(ind), 'b-guinda') +
      UI.kpi('mapa', '', 'Zonas con mayor incidencia', topL.length, topL.slice(0, 5).join(', ') || '—', 'b-guinda') +
      UI.kpi('reloj', '', 'Horario crítico', K.total ? K.franjaCritica : '—', K.franjaCriticaN + ' incidentes', 'b-guinda');

    const res = MAPA.plano($('mapa'), L, { modo: 'puntos', etiquetas: true, alSeleccionar: id => { const rs = L.filter(r => r.lug === id), h = UI.enlace('inspeccion', { lugar: id, grupo: g, caso: rs.length ? rs[rs.length - 1].cos : '' }); if (h) location.href = h; } });
    $('npuntos').textContent = res.lugares + ' puntos · ' + K.total + ' incidentes';

    const serie = M.serieMensual(L, base.desde, base.hasta), proy = M.proyeccion(serie, 3);
    const ult = serie.slice(-3), mh = ult.reduce((s, x) => s + x.n, 0) / (ult.length || 1), mp = proy.reduce((s, x) => s + x.n, 0) / (proy.length || 1);
    const cambio = mh ? Math.round((mp - mh) / mh * 100) : 0;
    const hHist = '<section class="tarjeta"><div class="tit"><div><small>HISTÓRICO Y ESTIMACIÓN</small><h2>Tendencia temporal</h2></div>' +
      (proy.length ? '<span class="cambio' + (cambio < 0 ? ' baja' : '') + '">' + (cambio >= 0 ? '↗ Sube ' : '↘ Baja ') + Math.abs(cambio) + ' %</span>' : '') + '</div>' +
      '<div class="cuerpo">' + (serie.length > 1 ? G.linea(serie, { proy, W: 420, H: 170 }) : '<p class="nota">Elige un rango de meses para ver la tendencia y la proyección.</p>') + '</div></section>';

    const porDia = M.DIAS.map((d, i) => ({ et: d, v: L.filter(r => M.u.diaDe(r.fecha) === i).length }));
    const porHora = M.FRANJAS.map(fr => ({ et: fr.slice(0, 2), v: K.franjas[fr] }));
    const items = patron === 'dia' ? porDia : porHora, top = items.reduce((a, b) => b.v > a.v ? b : a, items[0]);
    const hPatron = '<section class="tarjeta"><div class="tit"><div><small>PATRÓN DE OCURRENCIA</small><h2>Distribución por ' + (patron === 'dia' ? 'día' : 'hora') + '</h2></div></div><div class="cuerpo">' +
      '<div class="seg" id="seg-p" style="display:flex"><button data-p="dia" class="' + (patron === 'dia' ? 'on' : '') + '" style="flex:1">Día de la semana</button><button data-p="hora" class="' + (patron === 'hora' ? 'on' : '') + '" style="flex:1">Hora del día</button></div>' +
      G.columnas(items) + '<div class="destacado">' + I.reloj + (patron === 'dia' ? ({ Lun: 'Lunes', Mar: 'Martes', 'Mié': 'Miércoles', Jue: 'Jueves', Vie: 'Viernes', 'Sáb': 'Sábado', Dom: 'Domingo' })[top.et] : 'Franja ' + top.et + ' h') + ': ' + top.v + ' incidentes</div></div></section>';

    const filas = Object.keys(M.contar(L, r => r.lug)).map(lug => {
      const rs = L.filter(r => r.lug === lug), fases = M.contar(rs, r => r.fase);
      return { lug, rs, n: rs.length, fases };
    }).sort((a, b) => b.n - a.n);
    $('detalle').innerHTML = filas.map(f => {
      const fechas = f.rs.slice(-3).map(r => M.u.fmtFC(r.fecha)).join(' · '), horas = f.rs.slice(-3).map(r => r.hora).join(' · ');
      const acc = [...new Set(f.rs.map(r => M.ACCION_CORTA[r.tipo]))].join('; ');
      return '<tr><td><b>' + M.DATOS.lugares[f.lug].nombre + '</b></td><td>' + fechas + '</td><td>' + horas + '</td><td class="num"><b>' + f.n + '</b></td>' +
        '<td>' + UI.sem(f.rs[0].semaforo, (f.rs[0].semaforo === 'Rojo' ? 'Alta · Rojo' : 'Media · Amarillo')) + '</td>' +
        '<td>' + Object.keys(f.fases).map(k => f.fases[k] + ' ' + ({ 'En atención COSECOVI': 'en atención', 'Canalizado': f.fases[k] > 1 ? 'canalizados' : 'canalizado', 'Cerrado': f.fases[k] > 1 ? 'cerrados' : 'cerrado' })[k]).join('<br>') + '</td><td>' + acc + '</td><td>' + UI.ir('inspeccion', { lugar: f.lug, grupo: g }, 'Casos') + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="cen" style="padding:20px">Sin incidentes con estos filtros.</td></tr>';

    const comp = M.TIPOS.map(t => ({ et: M.corto(t), v: todos.filter(r => r.tipo === t).length, icono: UI.icSem(['Consumo de alcohol o drogas', 'Violencia (riña o agresión)'].includes(t) ? 'Amarillo' : 'Rojo'),
      color: ['Consumo de alcohol o drogas', 'Violencia (riña o agresión)'].includes(t) ? G.COL.amar : G.COL.rojo, on: M.GRUPOS[g].includes(t) }));
    const modos = [...new Set(M.GRUPOS[g].flatMap(t => M.MODOS_TIPO[t]))].map(m => ({ et: m, v: L.filter(r => r.modo === m).length })).filter(x => x.v || x.et !== 'Otro').sort((a, b) => b.v - a.v);
    const hModos = '<section class="tarjeta"><div class="tit"><div><small>CÓMO OCURRE</small><h2>Modalidad del delito seleccionado</h2><p>Según el bloque Cómo del formulario de captura.</p></div></div><div class="cuerpo">' + G.barras(modos, G.COL.guinda, 190) + '</div></section>';
    const hComp = '<section class="tarjeta"><div class="tit"><div><small>COMPARATIVO</small><h2>Incidentes por tipo de delito y semáforo</h2><p>El delito seleccionado aparece en negritas.</p></div></div><div class="cuerpo">' + G.barras(comp, null, 160) + '</div></section>';
    $('estad').innerHTML = UI.seccion('Estadísticas', 'Cómo se comporta el delito seleccionado en el tiempo y frente a los demás.', [hHist, hPatron, hModos, hComp], 2);
    $('seg-p').querySelectorAll('button').forEach(b => b.onclick = () => { patron = b.dataset.p; pintar(); });

    $('contexto').innerHTML = '<h4 style="margin:0;font-size:11px;font-weight:800;color:var(--guinda);letter-spacing:.6px">CONTEXTO</h4><p style="margin:2px 0 6px;font-size:13px;font-weight:600">Factores que influyen en el riesgo</p>' +
      '<div class="factor">' + I.reloj + '<div><b>Horario</b><span>' + (K.total ? 'La franja ' + K.franjaCritica + ' concentra ' + K.franjaCriticaN + ' de ' + K.total + ' reportes.' : 'Sin datos.') + '</span></div></div>' +
      '<div class="factor">' + I.mapa + '<div><b>Zona</b><span>' + (topL.length ? topL[0] + ' concentra ' + lugares[topL[0]] + ' casos.' : 'Sin datos.') + '</span></div></div>' +
      '<div class="factor">' + I.alerta + '<div><b>Tipo de delito</b><span>' + (rojo ? 'Pertenece al grupo de atención mayor y requiere atención prioritaria.' : 'Pertenece al grupo de atención amarilla: prevención y seguimiento.') + '</span></div></div>';
  }
  ['f-grupo', 'f-modo', 'f-amb', 'f-afe', 'f-fase', 'f-hd', 'f-hh'].forEach(id => $(id).onchange = pintar);
  $('limpiar').onclick = () => { ['f-modo', 'f-amb', 'f-afe', 'f-fase', 'f-hd', 'f-hh'].forEach(id => $(id).value = ''); pintar(); };
  UI.alCambiarPeriodo(pintar);
  pintar();
})();
</script>
</body>
</html>
