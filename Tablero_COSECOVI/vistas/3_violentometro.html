<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violentómetro y Acosómetro · Tablero COSECOVI</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .escala-cont { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
  .escala-cont > aside { position: sticky; top: 14px; }
  @media (max-width: 900px) { .escala-cont { grid-template-columns: 1fr; } .escala-cont > aside { position: static; } }
  .zona { border: 1px solid; border-left-width: 4px; border-radius: 8px; margin: 0 0 12px; overflow: hidden; }
  .zona-cab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .zona-cab small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .6px; }
  .zona-cab span { font-size: 14px; }
  .niv { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--borde); font-size: 12.5px; background: #fff; }
  .niv b { width: 26px; height: 22px; border-radius: 4px; color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
  .niv.pend { color: var(--texto-2); font-style: italic; }
  .z-rojo { border-color: #e6a9ae; } .z-rojo .zona-cab { background: var(--rojo-bg); color: var(--rojo); } .z-rojo .niv b { background: #a51d2a; }
  .z-amar { border-color: #ecc979; } .z-amar .zona-cab { background: #fff6dd; color: var(--amarillo); } .z-amar .niv b { background: #9a5b00; }
  .z-verde { border-color: #9fcdb3; } .z-verde .zona-cab { background: var(--verde-bg); color: var(--verde); } .z-verde .niv b { background: #1f6b48; }
  .z-gris { border-color: var(--borde); } .z-gris .zona-cab { background: #f6f3f4; color: var(--guinda); } .z-gris .niv b { background: var(--guinda); }
  .ic-verde { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--verde); color: #fff; font-size: 12px; font-weight: 900; }
  .paso { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--borde); font-size: 12.5px; }
  .paso b { width: 22px; height: 22px; border-radius: 50%; background: var(--guinda-claro); color: var(--guinda); display: grid; place-items: center; flex: none; font-size: 12px; }
</style>
</head>
<body>
<div class="pagina"></div>
<script src="../datos.js"></script><script src="../modelo.js"></script><script src="../cabecera.js"></script><script src="../escalas.js"></script>
<script>
(function () {
  if (!UI.cabecera('violentometro')) return;
  const I = UI.ICON;
  let cual = 'violentometro';
  const pendientes = e => Object.values(ESCALAS[e].niveles).filter(v => !v).length;

  UI.filtros(UI.fCampo('seg', 'Escala', '<div class="seg" id="seg"><button data-e="violentometro" class="on">Violentómetro <span class="etiqueta-gris">30 niveles</span></button><button data-e="acosometro">Acosómetro <span class="etiqueta-gris">17 niveles</span></button></div>'), '', false);

  document.querySelector('.pagina').innerHTML =
    UI.encabezado('usuarios', 'HERRAMIENTA DE CONSULTA', 'Violentómetro y Acosómetro', 'Identifica señales de riesgo y reconoce cuándo es necesario solicitar apoyo.') +
    '<div class="escala-cont"><section class="tarjeta" id="escala"></section>' +
    '<aside class="col"><section class="tarjeta"><div class="cuerpo" style="padding-top:14px">' +
      '<div class="kpi-ico" style="border-radius:8px;width:36px;height:36px">' + I.escudo + '</div>' +
      '<div class="tit" style="padding:10px 0 4px"><div><small>ORIENTACIÓN INMEDIATA</small><h2 style="font-size:19px">¿Qué hacer?</h2></div></div>' +
      '<p style="font-size:12.5px;color:var(--texto-2);margin:0 0 8px">Si identificas alguna de estas conductas, no la normalices. Registra lo ocurrido y busca acompañamiento institucional.</p>' +
      '<div class="paso"><b>1</b>Aléjate de una situación de riesgo inmediato.</div><div class="paso"><b>2</b>Solicita apoyo a una persona o área de confianza.</div><div class="paso"><b>3</b>Contacta a la Red de Género de ESCOM.</div>' +
      '<div class="alerta mal" style="margin-top:8px">' + I.alerta + '<div><b>En una emergencia, llama al 911.</b><br>Tu seguridad es la prioridad.</div></div>' +
      (UI.ROL.vistas.includes('recomendaciones') ? '<a class="btn lleno bloque" href="4_recomendaciones.html' + location.search + '" style="text-decoration:none">Ver estrategia preventiva recomendada ' + I.flecha + '</a>' : '') +
    '</div></section>' +
    '<section class="tarjeta" style="background:var(--guinda-claro);border-color:var(--rosa-borde)"><div class="cuerpo" style="padding-top:12px;font-size:12.5px"><b style="display:flex;gap:6px;align-items:center">' + I.corazon + 'No estás sola ni solo</b>Solicitar orientación es un primer paso válido y confidencial.</div></section></aside></div>';

  const $ = id => document.getElementById(id);
  function pintar() {
    const E = ESCALAS[cual], total = Object.keys(E.niveles).length;
    const icoZona = c => c === 'rojo' ? '<span class="ic-rojo" style="width:22px;height:22px">!</span>' : c === 'amar' ? '<span class="ic-amar" style="width:22px;height:22px">▲</span>' : c === 'verde' ? '<span class="ic-verde">✓</span>' : '';
    $('escala').innerHTML = '<div class="tit"><div><small>ESCALA ASCENDENTE · ' + total + ' NIVELES</small><h2>' + (cual === 'violentometro' ? 'Violentómetro' : 'Acosómetro') + '</h2><p>La gravedad aumenta de abajo hacia arriba. Cada nivel incluye número, texto y zona de atención.</p></div>' + (E.insignia ? '<div style="background:var(--guinda);color:#fff;border-radius:6px;padding:8px 16px;text-align:center;flex:none"><b style="font-size:16px">' + E.insignia[0] + '</b><br><span style="font-size:10.5px;font-weight:700">' + E.insignia[1] + '</span></div>' : '') + '</div>' +
      '<div class="cuerpo">' +
      (pendientes(cual) ? '<div class="alerta info">' + I.alerta + '<div>' + pendientes(cual) + ' niveles pendientes de copiar desde el prototipo de Figma en <b>escalas.js</b>.</div></div>' : '') +
      E.zonas.map(z => {
        let filas = '';
        for (let n = z.hasta; n >= z.desde; n--) { const t = E.niveles[n]; filas += '<div class="niv' + (t ? '' : ' pend') + '"><b>' + n + '</b>' + (t || 'Nivel ' + n + ' · texto pendiente') + '</div>'; }
        return '<div class="zona z-' + z.color + '"><div class="zona-cab">' + icoZona(z.color) + '<div><small>NIVELES ' + z.desde + '–' + z.hasta + '</small><span>' + z.titulo + '</span></div></div>' + filas + '</div>';
      }).join('') + '<p class="nota">' + I.usuarios + 'Material de la Red de Género · Consulta informativa · En caso de emergencia, llama al 911</p></div>';
  }
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => { cual = b.dataset.e; $('seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); pintar(); });
  pintar();
})();
</script>
</body>
</html>
