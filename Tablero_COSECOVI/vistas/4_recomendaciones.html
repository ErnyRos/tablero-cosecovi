<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomendaciones · Tablero COSECOVI</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .tarjetas, .enfoques { grid-template-columns: 1fr; } }
  .rec { border-top: 3px solid var(--rojo-solido); overflow: hidden; }
  .rec.amar { border-top-color: var(--amarillo-solido); }
  .rec-cab { background: #fdf4f5; padding: 12px 14px; border-bottom: 1px solid var(--borde); }
  .rec.amar .rec-cab { background: #fffaea; }
  .rec-cab h3 { margin: 8px 0 2px; font-size: 17px; }
  .rec-cab p { margin: 0; font-size: 12px; color: var(--texto-2); }
  .tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: #fff; }
  .datos-rec { display: flex; gap: 14px; font-size: 12px; margin-top: 8px; color: var(--texto); }
  .datos-rec b { color: var(--guinda); }
  .acc { display: flex; gap: 8px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--borde); font-size: 12.5px; }
  .acc:first-child { border-top: none; }
  .acc i { width: 16px; height: 16px; border-radius: 50%; background: var(--guinda); color: #fff; display: grid; place-items: center; font-size: 10px; font-style: normal; flex: none; }
  .rec.amar .acc i { background: var(--amarillo-solido); color: #3a2a00; }
  .enfoques { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .enfoque { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; font-size: 12px; background: #faf8f9; }
  .enfoque.princ { border-left: 3px solid var(--guinda); }
  .enfoque b { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .canal { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--borde); font-size: 12.5px; font-weight: 600; }
  .canal input { accent-color: var(--guinda); width: 16px; height: 16px; }
  .acc { align-items: flex-start !important; }
  .acc i { margin-top: 2px; }
  .acc small { display: block; color: var(--texto-2); font-size: 11.5px; margin-top: 2px; }
  .acc.base { color: var(--texto-2); }
  .acc.base i { background: #d9d2d5 !important; color: #fff !important; }
  .sustenta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 8px; }
  .sustenta b { color: var(--guinda); }
  .prio { margin-left: 8px; }
  .mini { font-size: 11.5px; color: var(--texto-2); }
</style>
</head>
<body>
<div class="pagina"></div>
<script src="../datos.js"></script><script src="../modelo.js"></script><script src="../cabecera.js"></script>
<script>
(function () {
  if (!UI.cabecera('recomendaciones')) return;
  const I = UI.ICON, u = M.u;
  let pag = 1;

  UI.filtros(
    UI.fSelect('f-grupo', 'Delito', M.REC.map(r => r.titulo), '', 'Todos los delitos').replace('class="campo"', 'class="campo ancho"') +
    UI.fSelect('f-nivel', 'Nivel de riesgo', [['Rojo', 'Riesgo alto'], ['Amarillo', 'Riesgo medio']], '', 'Todos los niveles'), '');

  document.querySelector('.pagina').innerHTML =
    UI.encabezado('escudo', 'ACCIONES PREVENTIVAS', 'Motor de recomendaciones', 'Estrategias sugeridas a partir de los casos y expedientes registrados en el periodo. Basadas en el Reglamento Interno del IPN y los lineamientos de la COSECOVI.') +
    '<div class="nota-info">' + I.alerta + '<div><b>Uso orientativo.</b> Cada acción muestra los casos que la sustentan. La recomendación final debe considerar el contexto y los protocolos aplicables.</div></div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<section>' + UI.titSeccion('Recomendaciones sugeridas', 'Ordenadas por casos abiertos. Las acciones sin casos que las activen en el periodo aparecen en gris como acción base.', '<span class="etiqueta-gris" id="nres"></span>') +
      '<div class="tarjetas" id="tarjetas"></div></section>' +
    '<section class="tarjeta"><div class="tit"><div><small>CASOS QUE SUSTENTAN LAS RECOMENDACIONES</small><h2>Expedientes abiertos y acción sugerida</h2><p>Cada caso sin cerrar se liga a su recomendación según su tipo de delito; la acción sugerida depende de su fase y de si hay reincidencia.</p></div></div>' +
      '<div class="t-env"><table class="t"><thead><tr><th>Caso</th><th>Expediente</th><th>Delito</th><th>Lugar</th><th>Fase</th><th>Recomendación</th><th>Acción sugerida</th></tr></thead><tbody id="casos"></tbody></table></div>' +
      '<div class="pie-tabla"><span id="conteo"></span><div class="paginas" id="pags"></div></div></section>' +
    UI.seccion('Criterios y difusión', 'Cómo se actúa y por qué canales se difunde la estrategia.', [
      UI.tarjetaG('CRITERIO DE ACTUACIÓN', 'Enfoque', '<div class="enfoques"><div class="enfoque princ"><b>Preventivo <span class="etiqueta-gris" style="color:var(--guinda)">Principal</span></b>Estrategias de concientización y difusión para reducir factores de riesgo antes de que ocurra un incidente.</div>' +
        '<div class="enfoque"><b>Correctivo</b>Se solicita al jefe de cuadrante de la SSC mediante el formato oficial, dejando constancia de la acción y su seguimiento.</div></div>'),
      UI.tarjetaG('ALCANCE DE CAMPAÑA', 'Canales de difusión', '<p class="nota" style="margin:0 0 6px">Selecciona los canales recomendados</p>' +
        '<label class="canal"><input type="checkbox" checked>Pantallas de la escuela</label><label class="canal"><input type="checkbox" checked>Redes oficiales de ESCOM</label><label class="canal"><input type="checkbox">Páginas oficiales en Google</label><p class="nota" id="canales-txt" style="margin-top:8px"></p>')
    ], 2);

  const $ = id => document.getElementById(id);
  const pg = new URLSearchParams(location.search).get('grupo');
  if (pg) { const r = M.REC.find(x => x.grupos.includes(pg)); if (r) $('f-grupo').value = r.titulo; }
  /* Canales de difusión: la selección se conserva */
  const canales = [...document.querySelectorAll('.canal input')];
  const guardados = M.preferencia('canales'); if (guardados) canales.forEach((c, i) => c.checked = guardados[i]);
  const resumenCanales = () => { const n = canales.filter(c => c.checked).length; $('canales-txt').textContent = n + ' de 3 canales seleccionados para difundir la estrategia.'; };
  canales.forEach(c => c.onchange = () => { M.preferencia('canales', canales.map(x => x.checked)); resumenCanales(); });

  const chipPrio = p => '<span class="chip np prio ' + (p === 'Alta' ? 'n-alto' : p === 'Media' ? 'n-medio' : 'r-neutro') + '">Prioridad ' + p.toLowerCase() + '</span>';
  function pintar() {
    const L = M.filtrar(UI.filtroGlobal()), g = $('f-grupo').value, n = $('f-nivel').value;
    const todas = M.recomendar(L), vis = todas.filter(r => (!g || r.titulo === g) && (!n || r.sem === n));
    const abiertosVis = vis.flatMap(r => r.E.abiertosL), expAb = M.expedientes(abiertosVis);
    const top = vis.find(r => r.E.casos);
    $('kpis').innerHTML =
      UI.kpi('escudo', '', 'Recomendaciones activas', vis.filter(r => r.E.abiertos).length + ' de ' + vis.length, 'Con casos abiertos en el periodo') +
      UI.kpi('doc', 'rojo', 'Casos abiertos que las sustentan', abiertosVis.length, expAb.length + ' expedientes', 'b-rojo') +
      UI.kpi('carpeta', 'amar', 'Expedientes con reincidencia', vis.reduce((s, r) => s + r.E.reincidencia, 0), 'Más de un reporte') +
      UI.kpi('enviar', 'morado', 'Canalizaciones sin respuesta', vis.reduce((s, r) => s + r.E.sinRespuesta, 0), 'Requieren seguimiento al oficio') +
      UI.kpi('alerta', '', 'Prioridad principal', top ? '<span style="font-size:15px">' + top.titulo + '</span>' : '—', top ? top.E.abiertos + ' abiertos de ' + top.E.casos + ' casos' : '');
    $('nres').textContent = vis.length + ' recomendaciones';
    $('tarjetas').innerHTML = vis.map(r => {
      const rojo = r.sem === 'Rojo', E = r.E;
      return '<section class="tarjeta rec' + (rojo ? '' : ' amar') + '"><div class="rec-cab"><span class="tag" style="color:' + (rojo ? 'var(--rojo)' : 'var(--amarillo)') + '">' + UI.icSem(r.sem) + (rojo ? 'Riesgo alto · Atención mayor' : 'Riesgo medio · Atención preventiva') + '</span>' + chipPrio(r.prioridad) +
        '<h3>' + r.titulo + '</h3><p>' + r.sub + '</p>' +
        '<div class="sustenta"><span>Casos: <b>' + E.casos + '</b></span><span>Expedientes: <b>' + E.expedientes + '</b></span><span>Abiertos: <b>' + E.abiertos + '</b></span><span>Reincidencia: <b>' + E.reincidencia + '</b></span><span>Lugar principal: <b>' + E.lugar[0] + '</b></span></div></div>' +
        r.acciones.map(a => '<div class="acc' + (a.sustento ? '' : ' base') + '"><i>✓</i><div>' + a.texto + '<small>' + (a.sustento || 'Acción base: sin casos que la activen en el periodo.') + '</small></div></div>').join('') +
        '<div class="atajos-ir" style="padding:10px 14px;border-top:1px solid var(--borde)">' + r.grupos.map(gr => UI.ir('inspeccion', { grupo: gr }, 'Ver casos de ' + gr.toLowerCase())).join('') + r.grupos.map(gr => UI.ir('delito', { delito: gr }, 'Analizar ' + gr.toLowerCase())).join('') + '</div></section>';
    }).join('') || '<p class="nota">Sin recomendaciones con estos filtros.</p>';

    const porPag = 8, filas = abiertosVis.slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1), total = filas.length;
    pag = Math.min(pag, Math.max(1, Math.ceil(total / porPag)));
    $('casos').innerHTML = filas.slice((pag - 1) * porPag, pag * porPag).map(c => {
      const rec = M.recDeTipo(c.tipo), h = UI.enlace('inspeccion', { caso: c.cos }), he = UI.enlace('inspeccion', { caso: c.exps[0] });
      return '<tr><td>' + (h ? '<a class="cos" href="' + h + '">' + c.cos + '</a>' : '<b>' + c.cos + '</b>') + '<br><span class="mini">' + u.fmtF(c.fecha) + '</span></td>' +
        '<td>' + (he ? '<a class="cos" href="' + he + '">' + c.exps.join(', ') + '</a>' : c.exps.join(', ')) + '</td><td>' + UI.sem(c.semaforo, M.corto(c.tipo)) + '</td>' +
        '<td>' + c.zona + '<br><span class="mini">' + c.lugar + '</span></td><td>' + UI.chipFase(c.fase) + '</td><td><b>' + rec.titulo + '</b></td><td>' + M.siguienteAccion(c) + '</td></tr>';
    }).join('') || '<tr><td colspan="7" class="cen" style="padding:20px">Sin casos abiertos con estos filtros.</td></tr>';
    $('conteo').textContent = total ? 'Mostrando ' + ((pag - 1) * porPag + 1) + '–' + Math.min(pag * porPag, total) + ' de ' + total + ' casos abiertos' : '0 casos abiertos';
    UI.paginar($('pags'), total, porPag, pag, p => { pag = p; pintar(); });
  }
  ['f-grupo', 'f-nivel'].forEach(id => $(id).onchange = () => { pag = 1; pintar(); });
  $('limpiar').onclick = () => { $('f-grupo').value = ''; $('f-nivel').value = ''; pag = 1; pintar(); };
  UI.alCambiarPeriodo(() => { pag = 1; pintar(); });
  pintar(); resumenCanales();
})();
</script>
</body>
</html>
